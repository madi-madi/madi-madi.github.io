<style>

/* Ubuntu terminal — one committed visual world, so no theme swap.
   Every colour is painted explicitly; nothing borrows the host ground. */
:root{
  --desk1:#2C0A20; --desk2:#1B0614; --win:#333131; --winline:#4A4646;
  --term:#300A24; --fg:#EEEEEC; --dim:#9A8E96; --faint:#5C4A56;
  --green:#8AE234; --blue:#729FCF; --orange:#E95420; --red:#EF5350;
  --mono:"Ubuntu Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:"Ubuntu",system-ui,-apple-system,Segoe UI,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100%;
  background:radial-gradient(120% 90% at 50% 0%, var(--desk1) 0%, var(--desk2) 70%);
  color:var(--fg); font-family:var(--ui);
  padding-block:clamp(20px,4vw,52px); padding-inline:16px;
}
.wrap{max-width:900px; margin:0 auto}

/* ---------- window chrome ---------- */
.win{
  border-radius:10px; overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.05) inset;
  border:1px solid var(--winline);
}
.bar{
  background:linear-gradient(180deg,#3B3838,#2F2C2C); border-bottom:1px solid #262323;
  display:flex; align-items:center; gap:10px; padding:9px 12px;
}
.bar .title{
  flex:1; text-align:center; font-family:var(--ui); font-size:13px; font-weight:500;
  color:#D7D2D2; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dots{display:flex; gap:7px; order:2}
.dots i{
  width:14px; height:14px; border-radius:50%; background:#5A5555; display:block;
  border:none; cursor:default;
}
.dots i:last-child{background:#6B5450}
.dots i:last-child:hover{background:var(--orange)}
.spacer{width:49px; order:0}
@media (max-width:560px){ .spacer{display:none} .bar .title{text-align:start} }

/* ---------- terminal ---------- */
.term{
  background:var(--term); font-family:var(--mono); font-size:15px; line-height:1.5;
  padding:14px 16px 16px; height:min(66vh,560px); overflow-y:auto; overflow-x:hidden;
  cursor:text; -webkit-font-smoothing:antialiased;
}
@media (max-width:560px){ .term{font-size:13.5px; height:min(60vh,460px)} }
.term::-webkit-scrollbar{width:9px}
.term::-webkit-scrollbar-thumb{background:#59394F; border-radius:5px}
.line{white-space:pre-wrap; word-break:break-word}
.u{color:var(--green); font-weight:700}
.p{color:var(--blue); font-weight:700}
.w{color:var(--fg)}
.dim{color:var(--dim)}
.err{color:var(--red)}
.ok{color:var(--green)}
.warn{color:#FFD24A}
.blk{margin:2px 0 10px}
.wide{overflow-x:auto; overflow-y:hidden; padding-bottom:4px}
.wide::-webkit-scrollbar{height:7px}
.wide::-webkit-scrollbar-thumb{background:#59394F; border-radius:4px}

/* neofetch */
.fetch{display:flex; gap:22px; align-items:flex-start}
@media (max-width:660px){ .fetch{flex-direction:column; gap:10px} }
.fetch pre{margin:0; color:var(--orange); font-size:10px; line-height:1.08; flex:none}
@media (max-width:660px){ .fetch pre{font-size:7.4px} }
.fetch dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:1px 12px; font-size:14px; min-width:0}
@media (max-width:560px){ .fetch dl{font-size:13px} }
.fetch dt{color:var(--orange); font-weight:700}
.fetch dd{margin:0; color:var(--fg); min-width:0; overflow-wrap:anywhere}

/* skills */
.sk{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px 18px; font-size:14px}
@media (max-width:640px){ .sk{grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px 12px} }
@media (max-width:400px){ .sk{grid-template-columns:minmax(0,1fr)} }
.skx{display:flex; gap:9px; align-items:flex-start; min-width:0}
.lg{flex:none; width:20px; height:20px; display:flex; align-items:center; justify-content:center; margin-top:1px}
.lg svg{width:18px; height:18px; display:block}
.skx .txt{min-width:0}
.skx .nm{display:block; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.skx .yr{display:block; color:var(--dim); font-size:12px; line-height:1.35; overflow-wrap:anywhere}
.grp{color:var(--dim); margin:10px 0 4px; font-size:12.5px; letter-spacing:.12em}
.grp:first-child{margin-top:0}

/* input */
.inline{display:flex; align-items:baseline; gap:0; flex-wrap:wrap}
#cmd{
  flex:1; min-width:120px; background:transparent; border:0; outline:0; padding:0;
  font-family:var(--mono); font-size:inherit; color:var(--fg); caret-color:var(--fg);
}
.cur{display:inline-block; width:8px; height:1.05em; background:var(--fg); vertical-align:text-bottom; margin-inline-start:1px}
@media (prefers-reduced-motion:no-preference){ .cur{animation:bl 1.05s steps(1,end) infinite} @keyframes bl{50%{opacity:0}} }

/* chips */
.chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:16px}
.chips button{
  font-family:var(--mono); font-size:13px; color:#E6DCE2;
  background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.13);
  border-radius:5px; padding:5px 11px; cursor:pointer; line-height:1.5;
}
.chips button:hover{background:rgba(233,84,32,.18); border-color:var(--orange); color:#fff}
.chips button:focus-visible{outline:2px solid var(--orange); outline-offset:2px}
#cmd:focus-visible{outline:none} /* the block cursor is the focus indicator here */
.hint{margin:11px 0 0; font-size:13.5px; color:#9B8C95; font-family:var(--ui)}
.hint a{color:#F0A387}
.hint kbd{
  font-family:var(--mono); font-size:12px; background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14); border-radius:3px; padding:1px 5px;
}
/* contact flow */
.ask{color:var(--orange); font-weight:700}
.sent{border-inline-start:2px solid var(--green); padding-inline-start:10px; color:var(--fg)}
.field{color:var(--blue)}

.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
</style>

/* ---------------------------------------------------------------- contact
   A three-step prompt that posts to FormSubmit, which needs no account and
   forwards straight to my inbox. Falls back to mailto if the POST fails. */
const ENDPOINT = "https://formsubmit.co/ajax/ibrahim.s.m.2010@gmail.com";
const STEPS_C = [
  { key: "name",    q: "your name" },
  { key: "email",   q: "your email", ok: v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v), err: "that does not look like an email" },
  { key: "message", q: "your message" }
];
let pending = null;

function askNext(){
  const st = STEPS_C[pending.step];
  out('<span class="ask">? </span><span class="field">' + esc(st.q) + "</span>");
}

function handleAnswer(v){
  if (v.trim().toLowerCase() === "cancel"){
    pending = null;
    out('<span class="dim">cancelled.</span>');
    return;
  }
  const st = STEPS_C[pending.step];
  if (!v.trim()){ out('<span class="err">' + esc(st.q) + " cannot be empty</span>"); return; }
  if (st.ok && !st.ok(v.trim())){ out('<span class="err">' + esc(st.err) + "</span>"); return; }
  pending.data[st.key] = v.trim();
  pending.step++;
  if (pending.step < STEPS_C.length){ askNext(); return; }

  const d = pending.data;
  pending = null;
  out('<span class="dim">sending …</span>');
  fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      name: d.name, email: d.email, message: d.message,
      _subject: "madi-madi.github.io — message from " + d.name,
      _template: "table"
    })
  })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(() => {
    out('<span class="sent"><span class="ok">Sent.</span> Thanks ' + esc(d.name) +
        " — I answer within a day, to " + esc(d.email) + ".</span>");
    track("contact/sent");
  })
  .catch(() => {
    const url = "mailto:ibrahim.s.m.2010@gmail.com?subject=" +
      encodeURIComponent("Message from " + d.name) + "&body=" + encodeURIComponent(d.message);
    out('<span class="err">The form could not reach my inbox.</span>\n' +
        '<span class="dim">Use <a href="' + url + '" style="color:var(--orange)">this mail link</a> ' +
        "or write to ibrahim.s.m.2010@gmail.com directly.</span>");
    track("contact/failed");
  })
  .finally(() => { drawPrompt(); term.scrollTop = term.scrollHeight; });
}

/* one counted event per command, so I can see what people actually try */

}

function run(raw){
  const line = raw.trim();
  echoCmd(line);
  if (pending){ handleAnswer(line); if (pending) drawPrompt(); term.scrollTop = term.scrollHeight; return; }
  if (line){
    const sp = line.indexOf(" ");
    const name = (sp < 0 ? line : line.slice(0, sp)).toLowerCase();
    const arg = sp < 0 ? "" : line.slice(sp + 1).trim();
    const fn = COMMANDS[name];
    track("cmd/" + (fn ? name : "unknown"));
    if (fn) fn(arg);
    else out('<span class="err">' + esc(name) + ": command not found</span>\n" +
             '<span class="dim">type <span class="ok">help</span> to see what works here</span>');
  }
  drawPrompt();
  term.scrollTop = term.scrollHeight;
}

let input, history = [], hpos = 0;
function drawPrompt(){
  const old = document.getElementById("live");
  if (old) old.remove();
  const d = document.createElement("div");
  d.className = "line inline"; d.id = "live";
  d.innerHTML = PROMPT;
  input = document.createElement("input");
  input.id = "cmd"; input.type = "text"; input.autocomplete = "off";
  input.spellcheck = false; input.setAttribute("aria-label", "Terminal command");
  d.appendChild(input);
  const cur = document.createElement("span");
  cur.className = "cur"; cur.setAttribute("aria-hidden", "true");
  d.appendChild(cur);
  term.appendChild(d);

  input.addEventListener("keydown", e => {
    if (e.key === "Enter"){
      const v = input.value;
      if (v.trim()){ history.push(v.trim()); hpos = history.length; }
      input.remove(); cur.remove();
      d.insertAdjacentHTML("beforeend", esc(v));
      d.id = "";
      run(v);
    } else if (e.key === "ArrowUp"){
      e.preventDefault();
      if (hpos > 0) input.value = history[--hpos];
    } else if (e.key === "ArrowDown"){
      e.preventDefault();
      if (hpos < history.length - 1) input.value = history[++hpos];
      else { hpos = history.length; input.value = ""; }
    } else if (e.key === "Tab"){
      e.preventDefault();
      const v = input.value.toLowerCase();
      const hit = Object.keys(COMMANDS).filter(c => c.startsWith(v));
      if (hit.length === 1) input.value = hit[0] + " ";
      else if (hit.length > 1) { out(hit.join("   ")); drawPrompt(); }
    }
  });
  input.focus({ preventScroll: true });
}

term.addEventListener("mousedown", e => {
  if (window.getSelection().toString()) return;
  if (e.target.tagName !== "INPUT" && input) { e.preventDefault(); input.focus(); }
});
